<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모바일 확인용</title>
<style>
  html,body{margin:0;background:#FBF9F5}
  iframe{width:390px;height:844px;border:0;display:block;background:#FBF9F5}
</style>
</head>
<body>
<iframe id="m" src="./index.html#map" title="모바일 미리보기"></iframe>
<script>
  var p=new URLSearchParams(location.search);
  var t=p.get('t')||'map';
  var z=p.get('z');
  var m=document.getElementById('m');
  m.src='./index.html#'+t;
  if(z) m.style.zoom=z;
</script>
</body>
</html>
